<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="756" viewBox="0 0 1200 756" role="img" aria-labelledby="title desc">
<title id="title">Two temporal branches with different representations</title><desc id="desc">tail25 retains channels and frames; Activity TCN models audio and ASR activity.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536b7c" /></marker></defs>
<rect width="1200" height="756" rx="18" fill="#f7fafc" />
<g font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">
<text x="38" y="52" font-size="29" fill="#19334a" font-weight="700" text-anchor="start">Two temporal branches with different representations</text>
<text x="38" y="84" font-size="16" fill="#536b7c" font-weight="400" text-anchor="start">tail25 retains channels and frames; Activity TCN models audio and ASR activity.</text>
<rect x="30" y="116" width="1140" height="278" rx="12" fill="#fff" stroke="#cedce5" />
<text x="51" y="153" font-size="23" fill="#266fa5" font-weight="700" text-anchor="start">tail25 · Framewise multimodal fusion</text>
<rect x="52" y="185" width="244" height="125" rx="12" fill="#fff" stroke="#cedce5" />
<text x="72" y="219" font-size="19.73" fill="#266fa5" font-weight="700" text-anchor="start">Channel hidden states</text>
<text x="72" y="252" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">1500 frames per channel</text>
<text x="72" y="279" font-size="11.89" fill="#19334a" font-weight="400" text-anchor="start">Shared convolutional downsampling</text>
<text x="72" y="306" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">→ 375 × 320 per channel</text>
<path d="M301,246 L324,246" fill="none" stroke="#536b7c" stroke-width="2" marker-end="url(#arrow)" />
<rect x="330" y="185" width="244" height="125" rx="12" fill="#fff" stroke="#cedce5" />
<text x="350" y="219" font-size="22" fill="#266fa5" font-weight="700" text-anchor="start">Framewise fusion</text>
<text x="350" y="252" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">ch0 / ch1 / |difference|</text>
<text x="350" y="279" font-size="14.7" fill="#19334a" font-weight="400" text-anchor="start">Add history label embeddings</text>
<text x="350" y="306" font-size="12.52" fill="#19334a" font-weight="400" text-anchor="start">→ 384 dims + position embeddings</text>
<path d="M578,246 L601,246" fill="none" stroke="#536b7c" stroke-width="2" marker-end="url(#arrow)" />
<rect x="607" y="185" width="244" height="125" rx="12" fill="#fff" stroke="#cedce5" />
<text x="627" y="219" font-size="19.62" fill="#266fa5" font-weight="700" text-anchor="start">Temporal Transformer</text>
<text x="627" y="252" font-size="15.56" fill="#19334a" font-weight="400" text-anchor="start">2 layers · 6 attention heads</text>
<text x="627" y="279" font-size="14.86" fill="#19334a" font-weight="400" text-anchor="start">Process all 375 history frames</text>
<text x="627" y="306" font-size="14.86" fill="#19334a" font-weight="400" text-anchor="start">Query-pool the last 25 frames</text>
<path d="M855,246 L878,246" fill="none" stroke="#536b7c" stroke-width="2" marker-end="url(#arrow)" />
<rect x="884" y="185" width="261" height="125" rx="12" fill="#fff" stroke="#cedce5" />
<text x="904" y="219" font-size="22" fill="#266fa5" font-weight="700" text-anchor="start">Prediction head</text>
<text x="904" y="252" font-size="12.66" fill="#19334a" font-weight="400" text-anchor="start">Append the Qwen text representation</text>
<text x="904" y="279" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">1408 → 512 → 128 → 5</text>
<text x="904" y="306" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">Five sigmoid outputs</text>
<text x="52" y="360" font-size="18" fill="#536b7c" font-weight="400" text-anchor="start">The last 25 frame representations already include context from the full history.</text>
<rect x="30" y="420" width="1140" height="299" rx="12" fill="#fff" stroke="#cedce5" />
<text x="51" y="458" font-size="23" fill="#218575" font-weight="700" text-anchor="start">Activity TCN · Lightweight activity sequences</text>
<rect x="52" y="490" width="244" height="132" rx="12" fill="#fff" stroke="#cedce5" />
<text x="72" y="524" font-size="22" fill="#218575" font-weight="700" text-anchor="start">62 features / 80 ms</text>
<text x="72" y="557" font-size="15.75" fill="#19334a" font-weight="400" text-anchor="start">Channel energy and activity</text>
<text x="72" y="584" font-size="13.06" fill="#19334a" font-weight="400" text-anchor="start">ASR boundaries / short responses</text>
<text x="72" y="611" font-size="13.39" fill="#19334a" font-weight="400" text-anchor="start">Normalize with training statistics</text>
<path d="M301,552 L324,552" fill="none" stroke="#536b7c" stroke-width="2" marker-end="url(#arrow)" />
<rect x="330" y="490" width="244" height="132" rx="12" fill="#fff" stroke="#cedce5" />
<text x="350" y="524" font-size="19.02" fill="#218575" font-weight="700" text-anchor="start">Temporal convolutions</text>
<text x="350" y="557" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">Project to 128 dimensions</text>
<text x="350" y="584" font-size="14.99" fill="#19334a" font-weight="400" text-anchor="start">6 residual convolution blocks</text>
<text x="350" y="611" font-size="15.92" fill="#19334a" font-weight="400" text-anchor="start">Dilation: 1 / 2 / 4 / 8 / 16 / 32</text>
<path d="M578,552 L601,552" fill="none" stroke="#536b7c" stroke-width="2" marker-end="url(#arrow)" />
<rect x="607" y="490" width="244" height="132" rx="12" fill="#fff" stroke="#cedce5" />
<text x="627" y="524" font-size="18.45" fill="#218575" font-weight="700" text-anchor="start">Four pooled summaries</text>
<text x="627" y="557" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">Last frame / tail-50 mean</text>
<text x="627" y="584" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">Tail-50 maximum</text>
<text x="627" y="611" font-size="13.75" fill="#19334a" font-weight="400" text-anchor="start">Full-sequence attention pooling</text>
<path d="M855,552 L878,552" fill="none" stroke="#536b7c" stroke-width="2" marker-end="url(#arrow)" />
<rect x="884" y="490" width="261" height="132" rx="12" fill="#fff" stroke="#cedce5" />
<text x="904" y="524" font-size="22" fill="#218575" font-weight="700" text-anchor="start">Prediction head</text>
<text x="904" y="557" font-size="15.09" fill="#19334a" font-weight="400" text-anchor="start">Concatenate to 512 dimensions</text>
<text x="904" y="584" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">MLP → Five sigmoid outputs</text>
<text x="904" y="611" font-size="14.69" fill="#19334a" font-weight="400" text-anchor="start">Independent ensemble member</text>
<text x="52" y="674" font-size="18" fill="#536b7c" font-weight="400" text-anchor="start">Uses audio and ASR activity, without history labels; includes an auxiliary future head during training.</text>
</g></svg>
