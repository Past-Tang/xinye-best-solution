<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="806" viewBox="0 0 1200 806" role="img" aria-labelledby="title desc">
<title id="title">Multimodal members · Audio, text and history</title><desc id="desc">Standard members share the encoder design; main and mean_diff use different channel pooling.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536b7c" /></marker></defs>
<rect width="1200" height="806" rx="18" fill="#f7fafc" />
<g font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">
<text x="38" y="52" font-size="29" fill="#19334a" font-weight="700" text-anchor="start">Multimodal members · Audio, text and history</text>
<text x="38" y="84" font-size="16" fill="#536b7c" font-weight="400" text-anchor="start">Standard members share the encoder design; main and mean_diff use different channel pooling.</text>
<rect x="36" y="120" width="352" height="95" rx="12" fill="#fff" stroke="#cedce5" />
<text x="56" y="154" font-size="22" fill="#266fa5" font-weight="700" text-anchor="start">Two-channel audio</text>
<text x="56" y="187" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">16 kHz · B × 2 × 480000</text>
<rect x="424" y="120" width="352" height="95" rx="12" fill="#fff" stroke="#cedce5" />
<text x="444" y="154" font-size="22" fill="#266fa5" font-weight="700" text-anchor="start">Conversation text</text>
<text x="444" y="187" font-size="14.62" fill="#19334a" font-weight="400" text-anchor="start">Speaker tags + transcripts · Up to 256 tokens</text>
<rect x="812" y="120" width="352" height="95" rx="12" fill="#fff" stroke="#cedce5" />
<text x="832" y="154" font-size="22" fill="#266fa5" font-weight="700" text-anchor="start">Historical event labels</text>
<text x="832" y="187" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">375 frames · 5 label classes</text>
<path d="M212,215 L212,251" fill="none" stroke="#536b7c" stroke-width="2" marker-end="url(#arrow)" />
<path d="M600,215 L600,251" fill="none" stroke="#536b7c" stroke-width="2" marker-end="url(#arrow)" />
<path d="M988,215 L988,251" fill="none" stroke="#536b7c" stroke-width="2" marker-end="url(#arrow)" />
<rect x="36" y="257" width="352" height="103" rx="12" fill="#fff" stroke="#cedce5" />
<text x="56" y="291" font-size="20" fill="#266fa5" font-weight="700" text-anchor="start">Shared Whisper-large-v3 encoder</text>
<text x="56" y="324" font-size="15.72" fill="#19334a" font-weight="400" text-anchor="start">Encode channels separately · Audio LoRA</text>
<text x="56" y="351" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">Per channel: B × 1500 × 1280</text>
<rect x="424" y="257" width="352" height="103" rx="12" fill="#fff" stroke="#cedce5" />
<text x="444" y="291" font-size="22" fill="#266fa5" font-weight="700" text-anchor="start">Qwen3-0.6B</text>
<text x="444" y="324" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">Backbone usually frozen</text>
<text x="444" y="351" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">textlora trains text LoRA adapters</text>
<rect x="812" y="257" width="352" height="103" rx="12" fill="#fff" stroke="#cedce5" />
<text x="832" y="291" font-size="22" fill="#266fa5" font-weight="700" text-anchor="start">ContextLabelEncoder</text>
<text x="832" y="324" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">Full-window conv + attention pooling</text>
<text x="832" y="351" font-size="16.33" fill="#19334a" font-weight="400" text-anchor="start">Tail 50 frames: conv + flatten + projection</text>
<path d="M212,360 L212,397" fill="none" stroke="#536b7c" stroke-width="2" marker-end="url(#arrow)" />
<path d="M600,360 L600,397" fill="none" stroke="#536b7c" stroke-width="2" marker-end="url(#arrow)" />
<path d="M988,360 L988,397" fill="none" stroke="#536b7c" stroke-width="2" marker-end="url(#arrow)" />
<rect x="36" y="403" width="352" height="134" rx="12" fill="#eaf4fb" stroke="#cedce5" />
<text x="56" y="437" font-size="22" fill="#266fa5" font-weight="700" text-anchor="start">Audio pooling</text>
<text x="56" y="470" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">main: framewise mean → tail pooling</text>
<text x="56" y="497" font-size="14.94" fill="#19334a" font-weight="400" text-anchor="start">Other standard members: pool each channel</text>
<text x="56" y="524" font-size="15.56" fill="#19334a" font-weight="400" text-anchor="start">→ mean / absolute difference → projection</text>
<rect x="424" y="403" width="352" height="134" rx="12" fill="#eaf4fb" stroke="#cedce5" />
<text x="444" y="437" font-size="22" fill="#266fa5" font-weight="700" text-anchor="start">Text pooling</text>
<text x="444" y="470" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">Last 30% of the encoded sequence</text>
<text x="444" y="497" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">attention pooling</text>
<text x="444" y="524" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">1024 dimensions</text>
<rect x="812" y="403" width="352" height="134" rx="12" fill="#eaf4fb" stroke="#cedce5" />
<text x="832" y="437" font-size="22" fill="#266fa5" font-weight="700" text-anchor="start">History pooling</text>
<text x="832" y="470" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">Full history + last 4 seconds</text>
<text x="832" y="497" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">Concatenate both branches</text>
<text x="832" y="524" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">128 dimensions</text>
<path d="M212,537 L212,567 L600,567 L600,596" fill="none" stroke="#536b7c" stroke-width="2" marker-end="url(#arrow)" />
<path d="M600,537 L600,596" fill="none" stroke="#536b7c" stroke-width="2" marker-end="url(#arrow)" />
<path d="M988,537 L988,567 L600,567" fill="none" stroke="#536b7c" stroke-width="2" marker-end="url(#arrow)" />
<rect x="245" y="603" width="710" height="95" rx="12" fill="#e9f5f0" stroke="#cedce5" />
<text x="265" y="637" font-size="20" fill="#218575" font-weight="700" text-anchor="start">Concatenate 2432 dimensions → MLP 512 → 128 → 5</text>
<text x="265" y="670" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">GELU + Dropout → Five sigmoid probabilities</text>
<text x="40" y="751" font-size="18" fill="#19334a" font-weight="400" text-anchor="start">Training: ChunkAux uses the audio sequence; textlora also uses FutureAux and a BC-specific loss.</text>
<text x="40" y="781" font-size="16" fill="#536b7c" font-weight="400" text-anchor="start">Inference data flow shown here. See the next figure for the framewise tail25 model.</text>
</g></svg>
