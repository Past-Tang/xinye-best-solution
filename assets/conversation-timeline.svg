<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">30 秒历史，预测接下来的 2 秒</title><desc id="desc">80 ms 为一个标签帧；历史窗口内提取特征，未来窗口只用于定义训练目标。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536b7c"/></marker></defs>
<rect width="1200" height="690" rx="18" fill="#f7fafc"/>
<g font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif">
<text x="38" y="52" font-size="29" fill="#19334a" font-weight="700" text-anchor="start">30 秒历史，预测接下来的 2 秒</text>
<text x="38" y="84" font-size="16" fill="#536b7c" font-weight="400" text-anchor="start">80 ms 为一个标签帧；历史窗口内提取特征，未来窗口只用于定义训练目标。</text>
<text x="38" y="141" font-size="20" fill="#266fa5" font-weight="700" text-anchor="start">输入 / 汇聚范围</text>
<line x1="280" y1="168" x2="280" y2="540" stroke="#cedce5" stroke-dasharray="4 6"/>
<text x="280" y="157" font-size="16" fill="#536b7c" font-weight="400" text-anchor="middle">-30s</text>
<line x1="520" y1="168" x2="520" y2="540" stroke="#cedce5" stroke-dasharray="4 6"/>
<text x="520" y="157" font-size="16" fill="#536b7c" font-weight="400" text-anchor="middle">-20s</text>
<line x1="760" y1="168" x2="760" y2="540" stroke="#cedce5" stroke-dasharray="4 6"/>
<text x="760" y="157" font-size="16" fill="#536b7c" font-weight="400" text-anchor="middle">-10s</text>
<line x1="856" y1="168" x2="856" y2="540" stroke="#cedce5" stroke-dasharray="4 6"/>
<text x="856" y="157" font-size="16" fill="#536b7c" font-weight="400" text-anchor="middle">-6s</text>
<line x1="904" y1="168" x2="904" y2="540" stroke="#cedce5" stroke-dasharray="4 6"/>
<text x="904" y="157" font-size="16" fill="#536b7c" font-weight="400" text-anchor="middle">-4s</text>
<line x1="952" y1="168" x2="952" y2="540" stroke="#cedce5" stroke-dasharray="4 6"/>
<text x="952" y="157" font-size="16" fill="#536b7c" font-weight="400" text-anchor="middle">-2s</text>
<line x1="1000" y1="168" x2="1000" y2="540" stroke="#cedce5" stroke-dasharray="4 6"/>
<text x="1000" y="157" font-size="16" fill="#536b7c" font-weight="400" text-anchor="middle">0</text>
<line x1="1048" y1="168" x2="1048" y2="540" stroke="#cedce5" stroke-dasharray="4 6"/>
<text x="1048" y="157" font-size="16" fill="#536b7c" font-weight="400" text-anchor="middle">2s</text>
<line x1="1000" y1="164" x2="1000" y2="545" stroke="#218575" stroke-width="3"/>
<text x="1000" y="124" font-size="19" fill="#218575" font-weight="700" text-anchor="middle">预测时刻</text>
<text x="38" y="217" font-size="18" fill="#19334a" font-weight="400" text-anchor="start">音频 / 文本 / 历史标签</text>
<rect x="280" y="188" width="720" height="43" rx="6" fill="#dcebf7" stroke="#cedce5"/>
<text x="640.0" y="216" font-size="17" fill="#19334a" font-weight="400" text-anchor="middle">375 个历史帧</text>
<text x="38" y="284" font-size="18" fill="#19334a" font-weight="400" text-anchor="start">常规音频尾部池化</text>
<rect x="856" y="255" width="144" height="43" rx="6" fill="#d9eee8" stroke="#cedce5"/>
<text x="928.0" y="283" font-size="17" fill="#19334a" font-weight="400" text-anchor="middle">6 s</text>
<text x="38" y="351" font-size="18" fill="#19334a" font-weight="400" text-anchor="start">历史标签尾部分支</text>
<rect x="904" y="322" width="96" height="43" rx="6" fill="#d9eee8" stroke="#cedce5"/>
<text x="952.0" y="350" font-size="17" fill="#19334a" font-weight="400" text-anchor="middle">4 s</text>
<text x="38" y="418" font-size="18" fill="#19334a" font-weight="400" text-anchor="start">tail25 query 汇聚</text>
<rect x="952" y="389" width="48" height="43" rx="6" fill="#d9eee8" stroke="#cedce5"/>
<text x="976.0" y="417" font-size="17" fill="#19334a" font-weight="400" text-anchor="middle">2 s</text>
<text x="38" y="485" font-size="18" fill="#19334a" font-weight="400" text-anchor="start">主任务目标</text>
<rect x="1000" y="456" width="48" height="43" rx="6" fill="#ffe4b5" stroke="#cedce5"/>
<text x="1060" y="484" font-size="18" fill="#bd862e" font-weight="400" text-anchor="start">25 个未来帧</text>
<rect x="38" y="572" width="538" height="84" rx="12" fill="#fff" stroke="#cedce5"/>
<text x="58" y="606" font-size="22" fill="#bd862e" font-weight="700" text-anchor="start">主头：窗口内是否出现</text>
<text x="58" y="639" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">输出 c / na / i / bc / t 五个独立概率</text>
<rect x="598" y="572" width="563" height="84" rx="12" fill="#fff" stroke="#cedce5"/>
<text x="618" y="606" font-size="22" fill="#218575" font-weight="700" text-anchor="start">FutureAux：指定时距的帧标签</text>
<text x="618" y="639" font-size="17" fill="#19334a" font-weight="400" text-anchor="start">+400 / +800 / +1200 / +2000 ms；按成员启用</text>
</g></svg>
