seed: 42
chunk_ms: 80
context_chunks: 375
target_chunks: 25
stride: 25
sample_rate: 16000
max_train_samples: null
max_valid_samples: null
num_workers: 2
pin_memory: true
persistent_workers: true
model:
  type: temporal
paths:
  project_root: .
  train_audio_dir: data/train/audio
  train_text_dir: data/train/text
  train_labels_dir: data/train/labels
  output_root: outputs/tail25_slim
  checkpoints_dir: outputs/tail25_slim/checkpoints
  logs_dir: outputs/tail25_slim/logs
  cache_root: .cache
labels:
  C: 0
  T: 1
  BC: 2
  I: 3
  NA: 4
  positive_ids:
  - 1
  - 2
  - 3
  multi_targets:
  - C
  - NA
  - I
  - BC
  - T
split:
  valid_ratio: 0.1
  by_conversation: true
audio_encoder:
  type: whisper_lora_chunkaux
  model_name: models/whisper-large-v3
  tail_frames: 300
  attn_implementation: sdpa
text_encoder:
  model_name: models/Qwen3-0.6B
  max_length: 256
  freeze_backbone: true
  tail_ratio: 0.3
context_encoder:
  vocab_size: 5
  embed_dim: 16
  channels:
  - 32
  - 64
  tail_k: 25
temporal:
  frame_mid: 320
  d_model: 384
  layers: 2
  heads: 6
  dropout: 0.1
  tail_k: 25
fusion_head:
  hidden_dims:
  - 512
  - 128
  dropout: 0.3
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - out_proj
  gradient_checkpointing: true
chunk_aux:
  enabled: true
  mid_dim: 256
  num_classes: 5
  whisper_frames: 1500
  target_frames: 375
  label_smoothing: 0.1
future_aux:
  enabled: true
  mid_dim: 256
  horizons:
  - 5
  - 10
  - 15
  - 25
  tail_frames: 150
  label_smoothing: 0.1
  loss_weight: 0.3
mix2:
  prob: 0.5
  alpha: 0.4
  k_max: 3
  modes:
  - mixup
  - multimix
robust_asl:
  gamma_neg: 4.0
  gamma_pos: 0.0
  margin: 0.05
  hill_lambda: 1.5
aux_schedule:
  e_strong: 5
  e_mid: 15
  w_strong: 0.5
  w_mid: 0.3
  w_late: 0.1
curriculum:
  e_warm: 5
  e_full: 15
  head_lr_late_scale: 0.5
  lora_lr_full_scale: 1.0
train:
  multi_label: true
  pos_weight_mode: per_label
  pos_weight:
  - 1.0
  - 1.0
  - 1.5
  - 3.0
  - 1.5
  mutex_weight: 0.3
  epochs: 25
  max_steps_per_epoch: 600
  eval_valid_max_batches: null
  batch_size: 24
  eval_batch_size: 32
  log_every_steps: 20
  learning_rate: 0.0003
  warmup_ratio: 0.05
  ema_decay: 0.98
  weight_ema_decay: 0.999
  weight_decay: 0.01
  grad_clip_norm: 1.0
  use_amp: true
  amp_dtype: bf16
  gradient_accumulation_steps: 1
  save_metric: tuned_macro_f1
  early_stop_patience: 6
  tuned_eval_subset: 20000
  tuned_eval_subset_seed: 42
  tuned_eval_threshold_min: 0.05
  tuned_eval_threshold_max: 0.95
  tuned_eval_threshold_step: 0.01
  save_epoch_checkpoints: true
env:
  HF_HOME: .cache/huggingface
  TORCH_HOME: .cache/torch
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
experiment:
  name: outputs_temporal_tail25
  rationale: tail_k=25 targets the verified 1-2s I/BC/T trigger window; isolated from
    tail_k=50 baseline.
