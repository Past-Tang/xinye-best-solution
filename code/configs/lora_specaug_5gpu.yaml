seed: 42
chunk_ms: 80
context_chunks: 375
target_chunks: 25
stride: 25
sample_rate: 16000
max_train_samples: null
max_valid_samples: null
num_workers: 2

paths:
  project_root: /workspace/xinye/code_src/pb
  train_audio_dir: /workspace/xinye/data/train/audio
  train_text_dir: /workspace/xinye/data/train/text
  train_labels_dir: /workspace/xinye/data/train/labels

  output_root: /workspace/xinye/code_src/pb/outputs_specaug_5gpu
  checkpoints_dir: /workspace/xinye/code_src/pb/outputs_specaug_5gpu/checkpoints
  logs_dir: /workspace/xinye/code_src/pb/outputs_specaug_5gpu/logs

  cache_root: /workspace/xinye/.cache

labels:
  C: 0
  T: 1
  BC: 2
  I: 3
  NA: 4
  positive_ids: [1, 2, 3]
  multi_targets: [C, NA, I, BC, T]

split:
  valid_ratio: 0.1
  by_conversation: true

audio_encoder:
  type: whisper_lora_chunkaux
  model_name: /app/models/whisper-large-v3
  tail_frames: 300
  channel_pool_mode: mean_diff

text_encoder:
  model_name: /app/models/Qwen3-0.6B
  max_length: 256
  freeze_backbone: true
  tail_ratio: 0.3

context_encoder:
  vocab_size: 5
  embed_dim: 16
  channels: [32, 64]
  tail_k: 50

fusion_head:
  hidden_dims: [512, 128]
  dropout: 0.3

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, out_proj]
  gradient_checkpointing: true

chunk_aux:
  enabled: true
  mid_dim: 256
  num_classes: 5
  whisper_frames: 1500
  target_frames: 375
  label_smoothing: 0.1

future_aux:
  enabled: true
  mid_dim: 256
  horizons: [5, 10, 15, 25]
  tail_frames: 150
  label_smoothing: 0.1
  loss_weight: 0.3

mix2:
  prob: 0.5
  alpha: 0.4
  k_max: 3
  modes: [mixup, multimix]

robust_asl:
  gamma_neg: 4.0
  gamma_pos: 0.0
  margin: 0.05
  hill_lambda: 1.5

aux_schedule:
  e_strong: 5
  e_mid: 15
  w_strong: 0.5
  w_mid: 0.3
  w_late: 0.1

curriculum:
  e_warm: 5
  e_full: 15
  head_lr_late_scale: 0.5
  lora_lr_full_scale: 1.0

# SpecAugment-style waveform-domain augmentation (dataset.py: TurnTakingTrainDataset._apply_audio_augment)
# 仅 train_dataset 启用；tuned_valid_dataset 不接收该 cfg，evaluate 保持干净。
# Time mask 等价 SpecAug 时间维度 mask（静音段 -> mel time frame floor）；max_ms=400 限定不超过 5 chunks
# 不破坏 chunk_aux 80ms 粒度的 dense label 监督。
# Gaussian noise SNR 18-30dB 模拟通道质量波动，正则化 Whisper encoder。
audio_augment:
  enabled: true
  time_mask:
    num: 2
    max_ms: 400
    apply_prob: 0.6
  noise:
    snr_db_min: 18.0
    snr_db_max: 30.0
    apply_prob: 0.5

train:
  multi_label: true
  pos_weight_mode: per_label
  pos_weight: [1.0, 1.0, 1.5, 3.0, 1.5]

  epochs: 25
  max_steps_per_epoch: 600
  eval_valid_max_batches: null

  batch_size: 24
  eval_batch_size: 32
  log_every_steps: 20

  learning_rate: 3.0e-4
  warmup_ratio: 0.05
  ema_decay: 0.98
  weight_decay: 0.01
  grad_clip_norm: 1.0
  use_amp: true
  amp_dtype: bf16
  gradient_accumulation_steps: 1

  save_metric: tuned_macro_f1
  early_stop_patience: 6

  tuned_eval_subset: 20000
  tuned_eval_subset_seed: 42
  tuned_eval_threshold_min: 0.05
  tuned_eval_threshold_max: 0.95
  tuned_eval_threshold_step: 0.01
  save_epoch_checkpoints: true

env:
  HF_HOME: /workspace/xinye/.cache/huggingface
  TRANSFORMERS_CACHE: /workspace/xinye/.cache/huggingface
  TORCH_HOME: /workspace/xinye/.cache/torch
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
