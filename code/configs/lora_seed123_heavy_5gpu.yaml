seed: 123
chunk_ms: 80
context_chunks: 375
target_chunks: 25
stride: 25
sample_rate: 16000
max_train_samples: null
max_valid_samples: null
num_workers: 0

paths:
  project_root: /workspace/xinye/code_src/pb
  train_audio_dir: /workspace/xinye/data/train/audio
  train_text_dir: /workspace/xinye/data/train/text
  train_labels_dir: /workspace/xinye/data/train/labels

  output_root: /workspace/xinye/code_src/pb/outputs_seed123_heavy
  checkpoints_dir: /workspace/xinye/code_src/pb/outputs_seed123_heavy/checkpoints
  logs_dir: /workspace/xinye/code_src/pb/outputs_seed123_heavy/logs

  cache_root: /workspace/xinye/.cache

labels:
  C: 0
  T: 1
  BC: 2
  I: 3
  NA: 4
  positive_ids: [1, 2, 3]
  multi_targets: [C, NA, I, BC, T]

split:
  valid_ratio: 0.1
  by_conversation: true

audio_encoder:
  type: whisper_lora_chunkaux
  model_name: /workspace/xinye/.cache/modelscope/AI-ModelScope/whisper-large-v3
  tail_frames: 300
  channel_pool_mode: mean_diff

text_encoder:
  model_name: /workspace/xinye/.cache/modelscope/Qwen/Qwen3-0___6B
  max_length: 256
  freeze_backbone: true
  tail_ratio: 0.3

context_encoder:
  vocab_size: 5
  embed_dim: 16
  channels: [32, 64]
  tail_k: 50

fusion_head:
  hidden_dims: [512, 128]
  dropout: 0.3

lora:
  r: 16
  alpha: 32
  target_modules: [q_proj, v_proj]
  dropout: 0.05

chunk_aux:
  e_strong: 5
  e_mid: 15
  w_strong: 0.5
  w_mid: 0.3
  w_late: 0.1

curriculum:
  e_warm: 5
  e_full: 15
  head_lr_late_scale: 0.5
  lora_lr_full_scale: 1.0

train:
  multi_label: true
  pos_weight_mode: per_label
  pos_weight: [1.0, 1.5, 5.0, 3.0, 1.0]

  epochs: 40
  max_steps_per_epoch: 1200
  eval_valid_max_batches: null

  batch_size: 32
  eval_batch_size: 40
  log_every_steps: 20

  learning_rate: 2.5e-4
  warmup_ratio: 0.05
  ema_decay: 0.98
  weight_decay: 0.01
  grad_clip_norm: 1.0
  use_amp: true
  amp_dtype: bf16
  gradient_accumulation_steps: 1

  save_metric: tuned_macro_f1
  early_stop_patience: 10

  tuned_eval_subset: 20000
  tuned_eval_subset_seed: 42
  tuned_eval_threshold_min: 0.05
  tuned_eval_threshold_max: 0.95
  tuned_eval_threshold_step: 0.01
  save_epoch_checkpoints: true

env:
  HF_HOME: /workspace/xinye/.cache/huggingface
  TRANSFORMERS_CACHE: /workspace/xinye/.cache/huggingface
  TORCH_HOME: /workspace/xinye/.cache/torch
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"